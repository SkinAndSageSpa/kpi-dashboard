name: Probe 9 — Ravenna LMT hours vs revenue

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROBE_DIR: /tmp/probe9-results
      SKINSAGE_MANGOMINT_COOKIES: ${{ secrets.SKINSAGE_MANGOMINT_COOKIES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run probe9
        run: node src/probe9.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe9-results
          path: /tmp/probe9-results/
          retention-days: 7

name: Generate KPI Dashboard

on:
  schedule:
    - cron: '12 2 * * *'   # ~7:12pm PT evening/primary (currently PDT, UTC-7)
    # Cron is UTC-fixed, so this drifts an hour earlier once DST ends (~Nov) —
    # bump hour to 3 then.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 60 (was 30): the manager pages add Esti/LMT scrapes and BI Sales fetches.
    # Normal nights only re-fetch the current month; the first run after a cache
    # reset backfills 6 months for both role groups.
    timeout-minutes: 60
    env:
      SCREENSHOT_DIR: /tmp/kpi-screenshots
      DASHBOARD_OUT: dashboard.html
      TEAM_SKINSAGE_OUT: team-skinsage.html
      TEAM_WAXON_OUT: team-waxon.html
      SKINSAGE_MANGOMINT_COOKIES: ${{ secrets.SKINSAGE_MANGOMINT_COOKIES }}
      WAXON_MANGOMINT_COOKIES: ${{ secrets.WAXON_MANGOMINT_COOKIES }}
      # Owner dashboard password (src/lockPage.js). Unset → owner page is replaced
      # by a "not configured" page rather than published unencrypted.
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get month key for cache
        id: date
        run: echo "ym=$(date -u +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Cache node_modules and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Restore prior-month KPI data cache
        uses: actions/cache/restore@v4
        with:
          path: data-cache.json
          key: kpi-data-v2-${{ steps.date.outputs.ym }}-${{ github.run_id }}
          restore-keys: |
            kpi-data-v2-${{ steps.date.outputs.ym }}-
            kpi-data-v2-

      - name: Scrape KPI data
        run: node src/scraper.js

      # The repo (and so its artifacts, dist branch and Pages site) is public:
      # encrypt the owner dashboard before it's uploaded or pushed anywhere.
      - name: Lock owner dashboard
        if: always()
        run: node src/lockPage.js dashboard.html

      - name: Save KPI data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data-cache.json
          key: kpi-data-v2-${{ steps.date.outputs.ym }}-${{ github.run_id }}

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard
          path: |
            dashboard.html
            team-skinsage.html
            team-waxon.html
          retention-days: 30
          if-no-files-found: warn

      # dist layout (served by GitHub Pages):
      #   index.html           owner dashboard (password-locked, see lockPage.js)
      #   skinsage/index.html  Skin & Sage manager page (Esti vs LMT, quarterly)
      #   waxon/index.html     WAXON manager page (monthly)
      # Rebuilt as a single fresh commit and force-pushed every run, so the public
      # branch never keeps a history of past (or pre-lock, unencrypted) dashboards.
      - name: Push dashboard to dist branch
        if: always()
        run: |
          [ -f dashboard.html ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dashboard.html /tmp/dashboard.html
          rm -f dashboard.html
          for t in skinsage waxon; do
            [ -f team-$t.html ] && mv team-$t.html /tmp/team-$t.html
          done
          git checkout --orphan dist-build
          git rm -rf . --quiet 2>/dev/null || true
          cp /tmp/dashboard.html index.html
          git add index.html
          for t in skinsage waxon; do
            if [ -f /tmp/team-$t.html ]; then
              mkdir -p $t
              cp /tmp/team-$t.html $t/index.html
              git add $t/index.html
            fi
          done
          git commit -q -m "Update dashboard $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f origin dist-build:dist

      - name: Upload screenshots (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-screenshots
          path: /tmp/kpi-screenshots/
          retention-days: 7

name: Probe — Staff Split (read-only)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROBE_DIR: /tmp/probe-staff
      SKINSAGE_MANGOMINT_COOKIES: ${{ secrets.SKINSAGE_MANGOMINT_COOKIES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run probe
        run: node src/probe-staff.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-staff-results
          path: /tmp/probe-staff/
          retention-days: 7

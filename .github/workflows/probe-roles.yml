name: Probe — Staff Roles (read-only)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROBE_DIR: /tmp/probe-roles
      SKINSAGE_MANGOMINT_COOKIES: ${{ secrets.SKINSAGE_MANGOMINT_COOKIES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run probe
        run: node src/probe-roles.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-roles-results
          path: /tmp/probe-roles/
          retention-days: 7
